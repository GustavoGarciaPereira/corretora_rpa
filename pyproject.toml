[project]
name = "corretor-rpa"
version = "0.1.0"
description = "Monitoramento de parcelas pendentes nas seguradoras"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
rpa = ["playwright>=1.47"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
corretor = "corretor.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corretor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/corretor/interfaces/web/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
